server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: industria-mem
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/industria_mem}
    username: ${SPRING_DATASOURCE_USERNAME:industria}
    password: ${SPRING_DATASOURCE_PASSWORD:industria_dev_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-min-32-characters-long-secret}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  upload:
    dir: ${UPLOAD_DIR:./uploads}
  cors:
    origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
  ai:
    service-url: ${AI_SERVICE_URL:http://localhost:8000}

logging:
  level:
    com.industriamem: INFO
