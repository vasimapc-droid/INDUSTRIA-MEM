version: '3.9'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: industria-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-industria_mem}
      POSTGRES_USER: ${POSTGRES_USER:-industria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-industria_dev_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U industria"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-service:
    build: ./ai-service
    container_name: industria-ai
    ports:
      - "8000:8000"
    environment:
      DEMO_MODE: ${DEMO_MODE:-true}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
      BACKEND_URL: http://backend:8080/api
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: ./backend
    container_name: industria-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-industria_mem}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-industria}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-industria_dev_pass}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-min-32-characters-long-secret}
      AI_SERVICE_URL: http://ai-service:8000
      UPLOAD_DIR: /app/uploads
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: industria-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
